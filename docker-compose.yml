services:
  app:
    build:
      context: app
      target: production
      args:
        APP_PORT: ${APP_PORT}
      secrets:
        - dot_env
    image: fretta-app:prod
    container_name: fretta-app
    environment:
      ENV_FILE: /run/secrets/dot_env
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    secrets:
      - source: dot_env
        uid: "65532"
        gid: "65532"
        target: /run/secrets/dot_env
        mode: 0400
    labels:
      - traefik.enable=true
      - traefik.http.routers.agendadepae-app.entrypoints=websecure
      - traefik.http.routers.fretta-app.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.fretta-app.tls.certresolver=letsencrypt
      - traefik.http.routers.fretta-app.tls=true
      - traefik.http.services.fretta-app.loadbalancer.server.port=${APP_PORT}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fretta_network

  database:
    container_name: fretta-db
    image: postgres:17-trixie
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_user
        target: /run/secrets/db_user
        mode: 0400
      - source: db_name
        target: /run/secrets/db_name
        mode: 0400
      - source: db_password
        target: /run/secrets/db_password
        mode: 0400
    volumes:
      - fretta_db_data:/var/lib/postgres/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          pg_isready
          -U "$${POSTGRES_USER:-$$(cat "$${POSTGRES_USER_FILE}" 2>/dev/null || echo postgres)}"
          -d "$${POSTGRES_DB:-$$(cat "$${POSTGRES_DB_FILE}" 2>/dev/null || echo postgres)}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fretta_network

volumes:
  fretta_db_data:
    name: fretta-db-data

networks:
  fretta_network:
    name: fretta-network
    driver: bridge

secrets:
  dot_env:
    file: /dev/shm/fretta-app/.env
  db_user:
    file: /dev/shm/fretta-app/db_user
  db_name:
    file: /dev/shm/fretta-app/db_name
  db_password:
    file: /dev/shm/fretta-app/db_password