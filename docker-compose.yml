services:
  app:
    build:
      context: app
      target: production
    image: fretta-app:prod
    container_name: fretta-app
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    environment:
      NODE_ENV: ${APP_NODE_ENV}
      DATABASE_URL: ${DB_URL}
      BETTER_AUTH_URL: ${APP_BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${APP_BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${APP_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: fretta-db
    image: postgres:17
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./_storage_/db:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

